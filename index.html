<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Custom Strava</title>

    <script>
      // Runs before the first paint, so the page never flashes the wrong theme
      // or a fully rendered header
      (function () {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="./style.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  </head>

  <body>
    <div class="page">
      <header class="header">
        <div class="header-row">
          <h1 translate="no"><button type="button" class="home-link" onclick="playTitleScramble()" title="Replay the animation">Custom Strava</button></h1>
          <div class="header-actions">
            <a class="icon-button" href="https://conancchen.github.io/" aria-label="Back to the home page" title="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7 3 3 7 7 11"></polyline>
                <path d="M3 7h11a6 6 0 0 1 0 12H6"></path>
              </svg>
            </a>
            <button class="icon-button" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch to light mode" title="Switch to light mode">
              <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="12" y1="2" x2="12" y2="4"></line>
                <line x1="12" y1="20" x2="12" y2="22"></line>
                <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line>
                <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line>
                <line x1="2" y1="12" x2="4" y2="12"></line>
                <line x1="20" y1="12" x2="22" y2="12"></line>
                <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line>
                <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>
              </svg>
              <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="subtitle" translate="no">Training log</p>
      </header>

      <p class="filters">
        <button type="button" class="filter is-on" data-filter="all">all</button>
        <button type="button" class="filter" data-filter="races">races</button>
        <span class="filter-gap" aria-hidden="true"></span>
        <button type="button" class="filter filter-icon" data-sport="run" aria-label="run only" title="run only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.2" cy="4.4" r="2"></circle><path d="M14.6 8.4l-3.4 4.6 3.8 1.8.8 4.4"></path><path d="M11.2 13L7.4 15.4l-3 1"></path><path d="M14.8 8.8l3.4 1 1.8-3.2"></path><path d="M14.4 8.6l-4 .2-2.6 2.8"></path></svg>
        </button>
        <button type="button" class="filter filter-icon" data-sport="bike" aria-label="bike only" title="bike only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg>
        </button>
        <button type="button" class="filter filter-icon" data-sport="swim" aria-label="swim only" title="swim only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path><path d="M2.5 12.5c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path><path d="M2.5 18c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path></svg>
        </button>
      </p>

      <div id="stats" class="year-stats"></div>

      <div id="log" class="log"></div>

      <hr class="rule">
      <p class="updated" id="footnote"></p>
    </div>

    <script src="./app.js"></script>

    <script>
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        var toggle = document.getElementById('theme-toggle');
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      }

      function toggleTheme() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        applyTheme(next);
      }

      applyTheme(document.documentElement.getAttribute('data-theme'));
    </script>

    <script>
      // The same title animation the main site uses: the name and the line under
      // it churn through simple Chinese characters and lock in left to right.
      window.playTitleScramble = function () {};
      window.setSubtitle = function (text) {
        var el = document.querySelector('.subtitle');
        if (el) el.textContent = text;
      };

      (function () {
        var link = document.querySelector('.home-link');
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!link || reduceMotion) return;

        var GLYPHS = '一乙二十丁七人入八九几儿了力乃刀又三干于亏士工土才下寸大丈与万上小口山巾千川个夕久么及广亡门义之尸弓己已子女飞刃习叉马乡王天夫元无云专不五支厅太犬区历友尤匹车巨牙屯戈比互切瓦止少日中贝内水见午牛手气毛长仁什片化币仍仅斤爪反介父从今凶分乏公仓月氏勿欠风丹匀乌凤勾文六方火为斗忆订计户认心打巧正扑扒功扔去甘世古节本术可丙左厉右石布龙平灭东卡北占业旧帅归且旦目叶甲申叮电号田由只史央兄叫另叹四生失禾丘付仗代';

        function randomGlyph() {
          return GLYPHS.charAt(Math.floor(Math.random() * GLYPHS.length));
        }

        var TICK = 40;          // ms between scramble frames
        var TOTAL_MS = 2200;    // when the last letter locks in
        var TOTAL_TICKS = TOTAL_MS / TICK;
        var LOCK_START = TOTAL_TICKS * 0.25;
        var LAST_LOCK = TOTAL_TICKS - 1;
        var SATURATION = 75;
        var LIGHTNESS_DARK = 70;
        var LIGHTNESS_LIGHT = 45;

        var targets = [];
        var tick = 0;
        var timer = null;

        function makeTarget(el, box) {
          var t = { el: el, box: box || el, chars: [], nodes: [] };
          t.box.style.height = t.box.offsetHeight + 'px';
          el.style.whiteSpace = 'nowrap';

          var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
          var texts = [];
          while (walker.nextNode()) texts.push(walker.currentNode);

          texts.forEach(function (node) {
            var frag = document.createDocumentFragment();
            var spans = node.nodeValue.split('').map(function (ch) {
              var span = document.createElement('span');
              frag.appendChild(span);
              t.chars.push({ span: span, ch: ch });
              return span;
            });
            if (!spans.length) return;
            node.parentNode.replaceChild(frag, node);
            t.nodes.push({ orig: node, spans: spans });
          });

          t.step = t.chars.length > 1 ? (LAST_LOCK - LOCK_START) / (t.chars.length - 1) : 0;
          targets.push(t);
        }

        function restore(t) {
          t.box.style.height = '';
          t.el.style.whiteSpace = '';
          t.nodes.forEach(function (n) {
            n.spans[0].parentNode.insertBefore(n.orig, n.spans[0]);
            n.spans.forEach(function (span) { span.parentNode.removeChild(span); });
          });
        }

        // The log tells us when it last synced, and that word arrives while the
        // line under the title is still churning. Swapping the text under the
        // animation lets it settle into the real line rather than landing on a
        // placeholder and then blinking to something else.
        window.setSubtitle = function (text) {
          var el = document.querySelector('.subtitle');
          if (!el) return;
          if (!timer) { el.textContent = text; return; }
          for (var i = 0; i < targets.length; i++) {
            if (targets[i].el !== el) continue;
            restore(targets[i]);
            targets.splice(i, 1);
            break;
          }
          el.textContent = text;
          makeTarget(el);
        };

        function randomColor() {
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          var hue = Math.floor(Math.random() * 360);
          return 'hsl(' + hue + ', ' + SATURATION + '%, ' + (dark ? LIGHTNESS_DARK : LIGHTNESS_LIGHT) + '%)';
        }

        function render() {
          targets.forEach(function (t) {
            t.chars.forEach(function (c, i) {
              if (tick >= LOCK_START + i * t.step || /\s/.test(c.ch)) {
                c.span.textContent = c.ch;
                c.span.style.color = '';
              } else {
                c.span.textContent = randomGlyph();
                c.span.style.color = randomColor();
              }
            });
          });
        }

        function play() {
          if (timer) return;
          targets = [];
          tick = 0;
          makeTarget(link, link.parentNode);
          var subtitle = document.querySelector('.subtitle');
          if (subtitle) makeTarget(subtitle);
          render();
          timer = setInterval(function () {
            tick++;
            render();
            if (tick >= TOTAL_TICKS) {
              clearInterval(timer);
              timer = null;
              targets.forEach(restore);
            }
          }, TICK);
        }

        link.setAttribute('aria-label', link.textContent);
        window.playTitleScramble = play;
        play();
      })();
    </script>
  </body>
</html>
