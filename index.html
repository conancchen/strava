<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>Custom Strava</title>

    <script>
      // Runs before the first paint, so the page never flashes the wrong theme
      // or a fully rendered header
      (function () {
        document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="./style.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./images/favicon-192.png">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  </head>

  <body>
    <div class="page">
      <header class="header">
        <div class="header-row">
          <h1 translate="no">Conan Chen</h1>
          <div class="header-actions">
            <a class="icon-button" href="https://conancchen.github.io/" aria-label="Back to the home page" title="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7 3 3 7 7 11"></polyline>
                <path d="M3 7h11a6 6 0 0 1 0 12H6"></path>
              </svg>
            </a>
            <button class="icon-button" id="theme-toggle" onclick="toggleTheme()" aria-label="Switch to dark mode" title="Switch to dark mode">
              <svg class="icon-yinyang" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
                <path class="yin" d="M12 1.75 A10.25 10.25 0 0 0 12 22.25 A5.125 5.125 0 0 0 12 12 A5.125 5.125 0 0 1 12 1.75 Z M13.6 17.125 A1.6 1.6 0 1 0 10.4 17.125 A1.6 1.6 0 1 0 13.6 17.125 Z M13.6 6.875 A1.6 1.6 0 1 0 10.4 6.875 A1.6 1.6 0 1 0 13.6 6.875 Z"></path>
                <path class="yang" d="M12 1.75 A10.25 10.25 0 0 1 12 22.25 A5.125 5.125 0 0 0 12 12 A5.125 5.125 0 0 1 12 1.75 Z M13.6 6.875 A1.6 1.6 0 1 0 10.4 6.875 A1.6 1.6 0 1 0 13.6 6.875 Z M13.6 17.125 A1.6 1.6 0 1 0 10.4 17.125 A1.6 1.6 0 1 0 13.6 17.125 Z"></path>
              </svg>
            </button>
          </div>
        </div>
        <p class="subtitle" translate="no">Custom Strava</p>
      </header>

      <p class="filters">
        <button type="button" class="filter is-on" data-filter="all">all</button>
        <button type="button" class="filter" data-filter="races">races</button>
        <span class="filter-gap" aria-hidden="true"></span>
        <button type="button" class="filter filter-icon" data-sport="run" aria-label="run only" title="run only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.6" cy="3.6" r="2.5" fill="currentColor" stroke="none"></circle><path d="M13.7 8.2L11.3 13.4" stroke-width="3.2"></path><path d="M13.4 8.4L9.8 6.4L7.6 9" stroke-width="2.2"></path><path d="M13.6 8.6L17.1 11.2L20.6 10.8" stroke-width="2.2"></path><path d="M11.3 13.4L8.3 15.9L3.6 16" stroke-width="2.5"></path><path d="M11.3 13.4L15.5 16.1L13.6 21.2" stroke-width="2.5"></path></svg>
        </button>
        <button type="button" class="filter filter-icon" data-sport="bike" aria-label="bike only" title="bike only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"></circle><circle cx="5.5" cy="17.5" r="3.5"></circle><circle cx="15" cy="5" r="1"></circle><path d="M12 17.5V14l-3-3 4-3 2 3h2"></path></svg>
        </button>
        <button type="button" class="filter filter-icon" data-sport="swim" aria-label="swim only" title="swim only">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path><path d="M2.5 12.5c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path><path d="M2.5 18c1.8-1.5 3.4-1.5 5.2 0s3.4 1.5 5.2 0 3.4-1.5 5.2 0"></path></svg>
        </button>
      </p>

      <div id="stats" class="year-stats"></div>

      <div id="log" class="log"></div>

      <hr class="rule">
      <p class="updated" id="footnote"></p>
    </div>

    <script src="./app.js"></script>

    <script>
      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        var label = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
        var toggle = document.getElementById('theme-toggle');
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      }

      // Each switch spins the yin-yang one full turn: clockwise into dark,
      // counterclockwise into light
      var yinyangAngle = 0;

      function switchTheme(next) {
        localStorage.setItem('theme', next);
        applyTheme(next);
        yinyangAngle += next === 'dark' ? 360 : -360;
        var icon = document.querySelector('#theme-toggle .icon-yinyang');
        icon.style.setProperty('--angle', yinyangAngle + 'deg');
      }

      // The new theme spills out of the yin-yang in a growing circle until it
      // covers the page. Browsers without view transitions, and anyone who
      // prefers reduced motion, just get the instant switch.
      function toggleTheme() {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!document.startViewTransition || reduceMotion) {
          switchTheme(next);
          return;
        }

        var box = document.getElementById('theme-toggle').getBoundingClientRect();
        var x = box.left + box.width / 2;
        var y = box.top + box.height / 2;
        var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));

        document.startViewTransition(function () { switchTheme(next); }).ready.then(function () {
          document.documentElement.animate(
            { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
            { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', pseudoElement: '::view-transition-new(root)' }
          );
        });
      }

      applyTheme(document.documentElement.getAttribute('data-theme'));
    </script>

  </body>
</html>
